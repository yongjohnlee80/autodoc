name     = "card-panes-go"
title    = "Library (Go card kit, two panes)"
kind     = "dialog"
protocol = 12                      # the pointer's drag (its divider follows it) and [window]'s icons
command  = ["./bin/autodoc-card-panes-go"]

[dialog]
modal      = false                 # a card beside the page
width      = 60
placements = ["right", "left"]

[window]
controls = ["hide", "maximize", "close"]   # _ + x on the panel's frame: hide it, maximize it, stop it

[install]
build = ["go", "build", "-o", "bin/autodoc-card-panes-go", "."]
