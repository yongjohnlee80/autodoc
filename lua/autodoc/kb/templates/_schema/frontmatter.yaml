# autodoc_version: {{autodoc_version}}
# The KB's one frontmatter schema (ADR 1791209946 §4). Managed by AutoDoc: it is replaced when a
# newer AutoDoc ships a newer copy, so a KB's own rules go in AGENTS.md, not here.
# `type` picks the document type; its fields are added to `common`. Diagnostics never block a write.
version: 2
strict: false
discriminator: type
# Files the schema doesn't judge: they keep their facets and have no diagnostics. raw/ is immutable
# source, _templates/ AutoDoc's own, archive/ retired, and .auto-agents/ and .junie/ tools'.
exempt: [raw/**, _templates/**, archive/**, .auto-agents/**, .junie/**]
common:
  type: {type: string, required: true, enum: [adr, adr-rationale, convention, playbook, reference, synthesis, review, pr, note, about, kb]}
  status: {type: string, required: true}
  created: {type: date, required: true}
  tags: {type: list, required: true}
  abstract: {type: string, required: true}
  title: {type: string}
  updated: {type: date}
  author: {type: string}
  sources: {type: list}
  related: {type: list}
  supersedes: {type: list}
  superseded_by: {type: list}
  amends: {type: list}
types:
  adr:
    # implemented reads as accepted
    status: {type: string, enum: [proposed, accepted, rejected, superseded, deprecated], aliases: {implemented: accepted}}
    number: {type: string, required: true}
    revision: {type: integer}
    formerly: {type: string}
    project: {type: string}
    repo: {type: string}
    reviewers: {type: list}
    decided_by: {type: string}
  adr-rationale:
    status: {type: string, enum: [proposed, accepted, rejected, superseded, deprecated]}
    adr: {type: string, required: true}
  convention:
    status: {type: string, enum: [draft, active, retired]}
    area: {type: string}
    revision: {type: integer}
    applies_to: {type: list}
  playbook:
    # draft-awaiting-execution reads as draft
    status: {type: string, enum: [draft, active, retired], aliases: {draft-awaiting-execution: draft}}
    area: {type: string}
    revision: {type: integer}
  reference:
    status: {type: string, enum: [active, stale]}
    kind: {type: string, enum: [glossary, route, source, reference]}
    source_sha: {type: string}
    ingested_at: {type: date}
  synthesis:
    # open reads as draft; revised, active, completed, implemented, closed and current as final
    status: {type: string, enum: [draft, final, superseded], aliases: {open: draft, revised: final, active: final, completed: final, implemented: final, closed: final, current: final}}
    kind: {type: string, enum: [analysis, investigation, lesson, bug-fix, benchmark, incident, design, evidence, handoff, research]}
  review:
    # open reads as in-progress; final, closed, complete, approved and changes-requested as completed
    status: {type: string, enum: [in-progress, completed], aliases: {open: in-progress, final: completed, closed: completed, complete: completed, approved: completed, changes-requested: completed}}
    reviewer: {type: string, required: true}
    subject: {type: string, required: true}
    # change_requested is the spelling a new review writes; changes_requested, changes-requested and
    # change-requested read as it; approved_pending_ci reads as approved_with_notes
    verdict: {type: string, enum: [approved, approved_with_notes, change_requested, rejected, commented], aliases: {changes_requested: change_requested, changes-requested: change_requested, change-requested: change_requested, approved_pending_ci: approved_with_notes}}
    round: {type: integer}
    repo: {type: string}
    pr: {type: integer}
    head: {type: string}
    base: {type: string}
    adr: {type: string}
  pr:
    status: {type: string, enum: [active, closed]}
    repo: {type: string, required: true}
    pr: {type: integer, required: true}
    state: {type: string, enum: [open, merged, closed]}
    head: {type: string}
    base: {type: string}
  note:
    status: {type: string, enum: [active, done]}
    kind: {type: string, enum: [task, scratch, incoming, handoff, draft]}
  about:
    status: {type: string, enum: [active]}
  kb:
    status: {type: string, enum: [active]}
    kind: {type: string, enum: [agents, rules, operations, readme, pointer]}
    autodoc_version: {type: string}
    revision: {type: integer}
