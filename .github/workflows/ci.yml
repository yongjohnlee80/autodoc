# The Go gate: gofmt, vet, build, the race-enabled tests twice, a static
# cross-build, govulncheck, and on a pull request the coverage policy (golib covercheck).
# Every action is pinned by its commit, the version it was tagged as beside it.
name: ci

# Pull requests merge into canary and run no CI (each has its own gate and review); CI runs on
# each merge into canary, and on the milestone pull request that merges canary into main.
on:
  push:
    branches: [canary]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Every repository of the account shares one pool of concurrent jobs, so CI runs only where it is
# read. A canary run is never cancelled: merges come faster than a run takes, so cancelling would
# never let one finish. A newer merge waits instead, and of the waiting runs only the newest is
# kept, so the run that starts next covers every merge since. A newer push to the milestone pull
# request cancels that pull request's older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request runs CI only when it is the milestone one, canary into main: any other into main
  # starts the workflow, but every job is skipped and holds no runner.
  test:
    if: github.event_name == 'push' || github.head_ref == 'canary'
    name: build, vet, test
    runs-on: ubuntu-latest
    services:
      # The Postgres the pgstore cells run against: ephemeral, CI-only. The
      # DSN below is a throwaway credential of this job, never a secret of any
      # real database. Each cell makes and drops its own scratch database.
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: autodoc
          POSTGRES_PASSWORD: autodoc
          POSTGRES_DB: autodoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autodoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGURL: postgres://autodoc:autodoc@localhost:5432/autodoc?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - run: go vet -tags server ./...

      - run: go build ./...

      - run: go build -tags server ./...

      # The desktop builds (no server tag) carry no server: none of its Postgres or enterprise code is
      # reachable from the binary, and --server refuses, naming the build that has it.
      - name: the untagged build has no server
        run: |
          if go list -deps ./cmd/autodoc | grep -E 'jackc/pgx|autodoc/core/pgstore|autodoc/enterprise|golib/dao/postgres'; then
            echo "::error::the untagged build reaches the server's packages"
            exit 1
          fi
          go test -count=1 -run '^TestAnUntaggedBuildRefusesTheServer$' ./app/

      # The community module never names the private one: no require, no import, in the code or
      # its tests. A commercial client builds on AutoDoc's public packages from its own module.
      - name: no private module
        run: |
          private=github.com/yongjohnlee80/autorag
          if grep -n "$private" go.mod go.sum; then
            echo "::error::go.mod or go.sum names $private"
            exit 1
          fi
          if go list -deps -test ./... | grep -n "^$private"; then
            echo "::error::a package depends on $private"
            exit 1
          fi

      # The Bun the OpenCode plugin's executable controls run on (app's TestThePluginsBunControls,
      # TestThePluginLoadsFromItsURL): the one opencode 1.18.31 embeds. By its SHA-256, from Bun's
      # SHASUMS256.txt for the release: a release asset can be replaced under the same tag.
      - name: install bun
        env:
          BUN_VERSION: "1.3.14"
          BUN_SHA256: "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f"
        run: |
          curl -fsSL -o /tmp/bun.zip \
            "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/bun-linux-x64.zip"
          echo "$BUN_SHA256  /tmp/bun.zip" | sha256sum -c -
          unzip -q -d /tmp/bun /tmp/bun.zip
          sudo install -m 0755 /tmp/bun/bun-linux-x64/bun /usr/local/bin/bun
          bun --version
          echo "AUTODOC_TEST_BUN=/usr/local/bin/bun" >> "$GITHUB_ENV"

      # -race because the daemon, the follower, the indexer's writer and the TUI
      # all run concurrently. -count=2 because a suite run once is a suite whose
      # flakes are someone else's problem later. The Postgres cells are required
      # here, where the service exists: they fail loudly rather than skip when
      # the URL is missing (AUTODOC_TEST_PG_REQUIRED, not CI: the macOS job runs
      # core/... too and has no service container to give it one). The plugin's Bun cells are
      # required here too (AUTODOC_TEST_BUN_REQUIRED), where the step above installed it.
      - name: test
        env:
          AUTODOC_TEST_PGURL: ${{ env.PGURL }}
          AUTODOC_TEST_PG_REQUIRED: "1"
          AUTODOC_TEST_BUN_REQUIRED: "1"
        run: |
          go list -tags server ./... | awk '$0 != "github.com/yongjohnlee80/autodoc/tui"' > "$RUNNER_TEMP/test-packages"
          mapfile -t packages < "$RUNNER_TEMP/test-packages"
          go test -race -count=2 -timeout 30m -tags server "${packages[@]}"

      # Linux ships without cgo (modernc SQLite). A macOS build without cgo still
      # builds and polls its roots instead of watching them; the release builds
      # macOS with cgo, on a Mac (the macos job below).
      - name: static cross-build smoke
        run: |
          CGO_ENABLED=0 GOOS=linux  GOARCH=arm64 go build -o /dev/null ./cmd/autodoc
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/autodoc
          CGO_ENABLED=0 GOOS=linux  GOARCH=arm64 go build -tags server -o /dev/null ./cmd/autodoc

  tui:
    if: github.event_name == 'push' || github.head_ref == 'canary'
    name: TUI race (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: test
        run: bash tests/run-tui-shard.sh "${{ matrix.shard }}" 8 > "$RUNNER_TEMP/tui-tests.jsonl"
      - name: test timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tui-race-${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ runner.temp }}/tui-tests.jsonl
          if-no-files-found: error
          retention-days: 7

  # The Lua side (lua/autodoc/): the suites under tests/, against a daemon built from this checkout,
  # in a pinned Neovim with a pinned auto-core.nvim (its hard dependency).
  lua:
    if: github.event_name == 'push' || github.head_ref == 'canary'
    runs-on: ubuntu-latest
    env:
      # auto-core's release the suites were verified against; bump deliberately, with the suites
      # run at the new pin.
      AUTO_CORE_SHA: "6f25b11"  # v0.5.2 (the commit, refs/tags/v0.5.2^{})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: install neovim
        env:
          # The version the suites were verified against, by its SHA-256: a release asset can be
          # replaced under the same tag, so the tag alone is not reproducible.
          NVIM_VERSION: "v0.12.2"
          NVIM_SHA256: "31cf85945cb600d96cdf69f88bc68bec814acbff50863c5546adef3a1bcef260"
        run: |
          curl -fsSL -o /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
          echo "$NVIM_SHA256  /tmp/nvim.tar.gz" | sha256sum -c -
          sudo tar -C /opt -xzf /tmp/nvim.tar.gz
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: fetch auto-core.nvim
        run: |
          git clone https://github.com/yongjohnlee80/auto-core.nvim "$RUNNER_TEMP/auto-core.nvim"
          git -C "$RUNNER_TEMP/auto-core.nvim" checkout "$AUTO_CORE_SHA"
          echo "AUTODOC_TEST_AUTOCORE=$RUNNER_TEMP/auto-core.nvim" >> "$GITHUB_ENV"
      - name: lua suites
        run: ./tests/run-all.sh

  # macOS watches workspace roots with FSEvents through cgo (golib vfs/local):
  # the follower's native watch, and the whole suite, on a Mac.
  macos:
    if: github.event_name == 'push' || github.head_ref == 'canary'
    name: macOS (cgo)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build both arches with cgo
        run: |
          CGO_ENABLED=1 GOARCH=arm64 go build -o /dev/null ./cmd/autodoc
          CGO_ENABLED=1 GOARCH=amd64 go build -o /dev/null ./cmd/autodoc

      # the release's macOS build carries the GUI (--gui): golib/gui on Gio, with cgo
      - name: build both arches with the GUI
        run: |
          CGO_ENABLED=1 GOARCH=arm64 go build -tags gui -o /dev/null ./cmd/autodoc
          CGO_ENABLED=1 GOARCH=amd64 go build -tags gui -o /dev/null ./cmd/autodoc

      - name: test the follower and the daemon (FSEvents)
        run: CGO_ENABLED=1 go test -race -count=2 -timeout 20m ./core/... ./rpc/...

  # The Linux GUI build (make build-gui, the release's -gui artifacts): cgo against the window
  # system's libraries. The static TUI build is the job above's.
  gui-linux:
    if: github.event_name == 'push' || github.head_ref == 'canary'
    name: Linux GUI (cgo)
    # On Ubuntu 24.04, where release.yml builds the GUI, so this job checks that build; the other
    # Linux jobs stay on ubuntu-latest and would show a new image's change first.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: the window system's libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev libxcursor-dev libxfixes-dev libvulkan-dev
      # VULKAN=1, not the default probe: this job stands in for release.yml's Linux GUI
      # artifacts, which are built with the Vulkan backend in, so a runner image that
      # stopped carrying libvulkan-dev must fail here rather than quietly switch to
      # -tags gui,novulkan and leave that backend uncompiled.
      - name: make build-gui
        run: make build-gui VULKAN=1 && ./bin/autodoc --version
      # every package, with the GUI built in: a package the GUI build changes is vetted as it ships
      - name: vet with the GUI
        run: go vet -tags gui ./...
      # The TUI's GUI-only cells (the title bar's buffer tabs, the GUI editor's keys): no other job
      # builds tui/ with the gui tag, so they ran nowhere and main stayed green while two failed.
      # They need no display (decltest's backend), and run without -race to keep this job short.
      - name: the TUI's GUI cells
        run: go test -tags gui -count=1 -timeout 20m ./tui/
      # The export's GUI cells: the chart hook draws a chart as SVG
      # (docs/decisions/editor.md#charts-drawn-as-svg). Named, since app's other cells start the
      # GUI, which needs a display. Few and quick, so with -race.
      - name: the export's GUI cells
        run: go test -race -tags gui -count=1 -run 'TheGUIBuildDrawsAnExportedChart|AnExportedChartGolibCannotDrawSaysWhy|CheckDiagramSaysWhatGolibDraws|TheDiagramReferenceIsGolibs|ExportASite|ExportThroughTheCommandLine' ./app/

  # govulncheck: the vulnerabilities the code reaches, in what each build links, under go.mod's
  # toolchain (the release builds with it): the default build, the server's and the GUI's. golang.org/x/vuln
  # at a pinned version, through go run, so its source is checked against the module checksum database.
  govulncheck:
    if: github.event_name == 'push' || github.head_ref == 'canary'
    name: govulncheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: the window system's libraries (the GUI build's cgo)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev libxcursor-dev libxfixes-dev libvulkan-dev
      - name: govulncheck
        env:
          GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@v1.9.0
        run: |
          go run "$GOVULNCHECK" ./...
          go run "$GOVULNCHECK" -tags server ./...
          go run "$GOVULNCHECK" -tags gui ./...

  coverage:
    name: coverage policy
    if: github.event_name == 'pull_request' && github.head_ref == 'canary'
    runs-on: ubuntu-latest
    services:
      # The same ephemeral Postgres the test job runs: the head-coverage run
      # executes the pgstore cells, so it needs the service to cover the
      # package at all (the cells are the only code paths that touch a
      # database).
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: autodoc
          POSTGRES_PASSWORD: autodoc
          POSTGRES_DB: autodoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autodoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.sha }}
      PGURL: postgres://autodoc:autodoc@localhost:5432/autodoc?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # The head run gets the service's URL and the requirement: without it
      # the cells would skip and the changed package would report no coverage
      # at all, failing the policy for a reason the log would not show.
      - name: generate head coverage
        env:
          AUTODOC_TEST_PGURL: ${{ env.PGURL }}
          AUTODOC_TEST_PG_REQUIRED: "1"
        run: >-
          go test -count=1 -timeout 20m -tags server -covermode=atomic
          -coverpkg=./... -coverprofile="$RUNNER_TEMP/coverage-head.out" ./...

      # The base run gets the URL only when the base tree already has
      # core/pgstore: this PR's base still carries the old destination test,
      # which is red against a real Postgres, and the service would fail the
      # step for a tree this PR does not change.
      - name: generate base coverage
        run: |
          git worktree add --detach "$RUNNER_TEMP/coverage-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/coverage-base"
          if [ -d core/pgstore ]; then
            export AUTODOC_TEST_PGURL="$PGURL"
          fi
          # A base with the server tag (app/server_on.go) builds its server only with it.
          tags=
          if [ -f app/server_on.go ]; then
            tags=server
          fi
          go test -count=1 -timeout 20m -tags "$tags" -covermode=atomic \
            -coverpkg=./... -coverprofile="$RUNNER_TEMP/coverage-base.out" ./...

      # covercheck is golib's, at the version go.mod requires: no install step
      # and nothing outside the module graph. app/gui_on.go builds only with the gui tag, which the
      # coverage run (cgo-free) never sets: its build is the gui-linux and macOS jobs'. The coverage
      # run sets the server tag, so app/server_off.go is left out: its cell runs in the test job's
      # untagged step.
      - name: enforce coverage policy
        id: coverage_policy
        continue-on-error: true
        run: |
          set +e
          go run github.com/yongjohnlee80/golib/cmd/covercheck \
            --base-profile "$RUNNER_TEMP/coverage-base.out" \
            --head-profile "$RUNNER_TEMP/coverage-head.out" \
            --base-ref "$BASE_SHA" \
            --head-ref "$HEAD_SHA" \
            --minimum-changed 70 \
            --maximum-total-regression 1 \
            --maximum-file-regression 1 \
            --require-changed-files \
            --exclude '^app/gui_on\.go$' \
            --exclude '^app/server_off\.go$' \
            --format markdown > "$RUNNER_TEMP/coverage-report.md"
          status=$?
          cat "$RUNNER_TEMP/coverage-report.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/coverage-report.md"
          exit "$status"

      - name: upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report-${{ github.run_id }}
          path: ${{ runner.temp }}/coverage-report.md
          if-no-files-found: ignore
          retention-days: 7

      - name: preserve coverage policy result
        if: steps.coverage_policy.outcome == 'failure'
        run: exit 1

  # A pull request from a fork gets a read-only token, so only this repo's own
  # branches get the comment; the job summary has the report either way.
  coverage-comment:
    name: coverage PR comment
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.head_ref == 'canary' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: download coverage report
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-report-${{ github.run_id }}
          path: ${{ runner.temp }}/coverage-report

      - name: create or update PR comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          COVERAGE_REPORT_PATH: ${{ runner.temp }}/coverage-report/coverage-report.md
          COVERAGE_JOB_RESULT: ${{ needs.coverage.result }}
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- covercheck-report -->'
            const reportPath = process.env.COVERAGE_REPORT_PATH
            const reportAvailable = fs.existsSync(reportPath) && fs.statSync(reportPath).size > 0
            let report = reportAvailable
              ? fs.readFileSync(reportPath, 'utf8').trim()
              : [
                  '## Coverage check: ERROR',
                  '',
                  'The coverage job did not produce a report. Open the workflow run for the generation error.',
                ].join('\n')

            const maxReportLength = 60000
            if (report.length > maxReportLength) {
              report = report.slice(0, maxReportLength) +
                '\n\n_Report truncated; open the workflow run for the complete output._'
            }

            const runURL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const headSHA = context.payload.pull_request.head.sha.slice(0, 7)
            const body = [
              marker,
              report,
              '',
              `<sub>Updated for \`${headSHA}\` · [workflow run](${runURL}) · coverage job: ${process.env.COVERAGE_JOB_RESULT}</sub>`,
            ].join('\n')

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
