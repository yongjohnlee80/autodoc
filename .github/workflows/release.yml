# A pushed v* tag builds the binary for each platform
# and attaches them, with checksums, to that tag's GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Linux builds static, the TUI alone, from Ubuntu. A Linux "-gui" build adds the GUI (--gui):
  # cgo, against the window system's libraries, which it then needs to run; built natively on each
  # architecture's runner. macOS builds with cgo, on a Mac: golib watches the workspace roots with
  # FSEvents there, which needs cgo and the SDK, so its one build carries the GUI too, and needs
  # only macOS itself to run.
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64, runner: ubuntu-latest,    cgo: "0", tags: "",    suffix: "" }
          - { goos: linux,  goarch: arm64, runner: ubuntu-latest,    cgo: "0", tags: "",    suffix: "" }
          - { goos: linux,  goarch: amd64, runner: ubuntu-latest,    cgo: "1", tags: "gui", suffix: "-gui" }
          - { goos: linux,  goarch: arm64, runner: ubuntu-24.04-arm, cgo: "1", tags: "gui", suffix: "-gui" }
          - { goos: darwin, goarch: amd64, runner: macos-latest,     cgo: "1", tags: "gui", suffix: "" }
          - { goos: darwin, goarch: arm64, runner: macos-latest,     cgo: "1", tags: "gui", suffix: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: the window system's libraries (Linux GUI)
        if: matrix.goos == 'linux' && matrix.tags == 'gui'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev libxcursor-dev libxfixes-dev libvulkan-dev
      - name: build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          OUT="autodoc-${VERSION}-${GOOS}-${GOARCH}${{ matrix.suffix }}"
          # -s -w: no symbol table or DWARF; stack traces keep their function
          # names. -trimpath keeps the runner's paths out of the binary.
          go build -tags "${{ matrix.tags }}" -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "${OUT}" ./cmd/autodoc
          tar czf "${OUT}.tar.gz" "${OUT}"
          shasum -a 256 "${OUT}.tar.gz" > "${OUT}.tar.gz.sha256" # on Ubuntu and macOS alike
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      # Create when absent, upload either way: `gh release create` fails when
      # the release already exists (notes written by hand, a re-run, a retry),
      # and the binaries are the part a consumer cannot rebuild themselves.
      # --clobber makes a re-run idempotent.
      - name: publish the release and attach the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; keeping its notes"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/*.tar.gz.sha256 \
            --clobber

      # An upload of a glob that matched nothing, or a partial upload, exits 0,
      # so the count is asserted: a tarball and a checksum per platform built.
      - name: verify every artifact reached the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          want=$(ls -1 dist/*.tar.gz dist/*.tar.gz.sha256 | wc -l)
          got=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets | length')
          echo "artifacts built: ${want}; assets on the release: ${got}"
          if [ "${got}" -lt "${want}" ]; then
            echo "::error::${got} assets on ${GITHUB_REF_NAME} but ${want} were built; the release is incomplete"
            exit 1
          fi
