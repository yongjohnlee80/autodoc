# A pushed v* tag builds the binary for each platform
# and attaches them, with checksums, to that tag's GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # On Linux, from v0.3.4, the unsuffixed archive is the GUI build (--gui): cgo, against the window
  # system's libraries, which it then needs to run; built natively on each architecture's runner. It
  # is unsuffixed so that a plain install (mise's github backend takes the archive with no suffix)
  # gets the GUI. The "-tui" archive is the static build of the TUI alone (unsuffixed up to v0.3.3,
  # when the GUI build was "-gui": autodoc.nvim's installer and the Homebrew tap choose by the tag).
  # A Linux "-server" build is the enterprise search server (--server, the server tag): static too,
  # it adds Postgres and the enterprise packages, which every other archive leaves out. macOS builds
  # with cgo, on a Mac: golib watches the workspace roots with FSEvents there, which needs cgo and
  # the SDK, so its one build carries the GUI too, and needs only macOS itself to run. The Ubuntu
  # runners are pinned to 24.04, not ubuntu-latest (whose move to Ubuntu 26 begins 2026-10-19): the
  # GUI build needs the glibc it was built against, and the apt names below are 24.04's, so a release
  # moves to a new Ubuntu only when someone chooses to.
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64, runner: ubuntu-24.04,     cgo: "0", tags: "",    suffix: "-tui" }
          - { goos: linux,  goarch: arm64, runner: ubuntu-24.04,     cgo: "0", tags: "",    suffix: "-tui" }
          - { goos: linux,  goarch: amd64, runner: ubuntu-24.04,     cgo: "0", tags: "server", suffix: "-server" }
          - { goos: linux,  goarch: arm64, runner: ubuntu-24.04,     cgo: "0", tags: "server", suffix: "-server" }
          - { goos: linux,  goarch: amd64, runner: ubuntu-24.04,     cgo: "1", tags: "gui", suffix: "" }
          - { goos: linux,  goarch: arm64, runner: ubuntu-24.04-arm, cgo: "1", tags: "gui", suffix: "" }
          - { goos: darwin, goarch: amd64, runner: macos-latest,     cgo: "1", tags: "gui", suffix: "" }
          - { goos: darwin, goarch: arm64, runner: macos-latest,     cgo: "1", tags: "gui", suffix: "" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: the window system's libraries (Linux GUI)
        if: matrix.goos == 'linux' && matrix.tags == 'gui'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev libxcursor-dev libxfixes-dev libvulkan-dev
      - name: build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          OUT="autodoc-${VERSION}-${GOOS}-${GOARCH}${{ matrix.suffix }}"
          # -s -w: no symbol table or DWARF; stack traces keep their function
          # names. -trimpath keeps the runner's paths out of the binary.
          go build -tags "${{ matrix.tags }}" -trimpath -ldflags "-s -w -X main.version=${VERSION} -X main.buildDate=$(date -u +%F)" -o "${OUT}" ./cmd/autodoc
          tar czf "${OUT}.tar.gz" "${OUT}"
          shasum -a 256 "${OUT}.tar.gz" > "${OUT}.tar.gz.sha256" # on Ubuntu and macOS alike
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
          path: dist
      # Create when absent, upload either way: `gh release create` fails when
      # the release already exists (notes written by hand, a re-run, a retry),
      # and the binaries are the part a consumer cannot rebuild themselves.
      # --clobber makes a re-run idempotent.
      - name: publish the release and attach the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; keeping its notes"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/*.tar.gz.sha256 \
            --clobber

      # An upload of a glob that matched nothing, or a partial upload, exits 0,
      # so the count is asserted: a tarball and a checksum per platform built.
      - name: verify every artifact reached the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          want=$(ls -1 dist/*.tar.gz dist/*.tar.gz.sha256 | wc -l)
          got=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets | length')
          echo "artifacts built: ${want}; assets on the release: ${got}"
          if [ "${got}" -lt "${want}" ]; then
            echo "::error::${got} assets on ${GITHUB_REF_NAME} but ${want} were built; the release is incomplete"
            exit 1
          fi
