# The documentation site (docs/decisions/editor.md#the-documentation-site): a pushed v* tag builds
# docs/ with AutoDoc's own export (autodoc --export=site, the sections docs/site.toml names) and
# deploys it to GitHub Pages, so the site is the release's. It builds with -tags gui, so the charts
# are drawn (golib's gui/vegalite on a gui.SVGCanvas); building them needs the window system's
# libraries, as the release's Linux GUI build does, but no display. The repository's Pages source is
# "GitHub Actions" (Settings › Pages). Its runners are Ubuntu 24.04, as release.yml's are, for the
# same window-system packages.
name: pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod # the one Go version, go.mod's
          cache: true
      - name: the window system's libraries (the GUI build draws the charts)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev libxcursor-dev libxfixes-dev libvulkan-dev
      - name: build the site
        run: go run -tags gui ./cmd/autodoc --export=site --output _site docs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5