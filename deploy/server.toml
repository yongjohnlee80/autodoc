# An example server.toml for the systemd unit (deploy/systemd); deploy/container has its own.
# Every secret is read from the environment: put them in the unit's EnvironmentFile, or the
# container's environment, never in this file. docs/enterprise/server-config.md has every field.

[postgres]
dsn_env = "AUTODOC_SERVER_DSN"
schema  = "autodoc_search"

[embedding]
provider = "ollama"
base_url = "http://ollama:11434"
model    = "nomic-embed-text"

[http]
# This host's loopback only, for the systemd unit: a TLS-terminating proxy on this host is in front
# (proxy = true). Listening anywhere else needs tls_cert and tls_key (docs/enterprise/operations.md).
# The container's copy (deploy/container/server.toml) differs in this one line.
listen = "127.0.0.1:8730"
proxy  = true

[[http.client]]
name      = "web-app"
token_env = "WEB_APP_TOKEN"
[http.client.grants.music]
label_id = ["*"]

[[http.operator]]
name      = "ops"
token_env = "AUTODOC_OPS_TOKEN"
tenants   = ["*"]

[log]
metrics_interval = "1m"

[[source]]
tenant        = "music"
view          = "views/track.view"
access        = ["label_id"]
refresh       = "24h"
refresh_retry = "15m"
