# An example server.toml for the container (compose.yml beside it); deploy/server.toml is the unit's.
# Every secret is read from the environment: put them in the unit's EnvironmentFile, or the
# container's environment, never in this file. docs/enterprise/server-config.md has every field.

[postgres]
dsn_env = "AUTODOC_SERVER_DSN"
schema  = "autodoc_search"

[embedding]
provider = "ollama"
base_url = "http://ollama:11434"
model    = "nomic-embed-text"

[http]
# Every address of the container's own network: compose publishes it on the host's loopback only
# (127.0.0.1:8730), where the proxy in front terminates TLS (docs/enterprise/operations.md). The
# systemd unit's copy (deploy/server.toml) differs in this one line.
listen = "0.0.0.0:8730"
proxy  = true

[[http.client]]
name      = "lm-web"
token_env = "LM_WEB_TOKEN"
[http.client.grants.lm-catalog]
label_id = ["*"]

[[http.operator]]
name      = "ops"
token_env = "AUTODOC_OPS_TOKEN"
tenants   = ["*"]

[log]
metrics_interval = "1m"

[[source]]
tenant        = "lm-catalog"
view          = "views/track.view"
access        = ["label_id"]
refresh       = "24h"
refresh_retry = "15m"
